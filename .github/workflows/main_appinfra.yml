# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - AppInfra

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: acrinfras.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_C3220724667F4EBFA075D03C1C51129D }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_D14976EFE6F64B3DBA864259C09DE1B3 }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: acrinfras.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_C3220724667F4EBFA075D03C1C51129D }}/api-backend:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    needs: build
    
    steps:
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_936748F8F3ED4B999FCD1716833C79B8 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_FFF2CD4F46F74EE5AF8F9AADBD4F4A39 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B037391A8FDC449DA42DF0773B449540 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'AppInfra'
          slot-name: 'Production'
          images: 'acrinfras.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_C3220724667F4EBFA075D03C1C51129D }}/api-backend:${{ github.sha }}'
          